<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>墨白云注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #7a4ca8 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .register-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 90%; max-width: 400px;
        }
        .register-title {
            text-align: center; font-size: 28px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        .form-input {
            width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9;
            border-radius: 8px; font-size: 16px; transition: all 0.3s;
        }
        .form-input:focus { outline: none; border-color: #667eea; }
        .register-button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .register-button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.3); }
        .error-message {
            background: #fee; color: #c33; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px; border-left: 4px solid #c33;
        }
        .login-link { text-align: center; margin-top: 16px; }
        .login-link a { color: #667eea; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1 class="register-title">墨白云注册</h1>
        {% if error %}<div class="error-message">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="2-20 个字符" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="至少 4 个字符" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="invite-code">邀请码</label>
                <input type="text" id="invite-code" name="invite_code" class="form-input" placeholder="请输入邀请码" required>
            </div>
            <button type="submit" class="register-button">注册</button>
        </form>
        <div class="login-link"><a href="{{ url_for('login') }}">已有账号？去登录</a></div>
    </div>
</body>
</html>
